services:
  mysql-test:
    image: mysql:8.0
    container_name: casahogar-test-mysql
    restart: "no"
    environment:
      TZ: America/Santiago
      MYSQL_ROOT_PASSWORD: testpass123
      MYSQL_DATABASE: casahogar_test
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3307:3306"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=America/Santiago
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptestpass123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
